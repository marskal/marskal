[package]
name = "marskal-shell-common"
version = "0.1.0"
edition = "2024"
description = "Sign-in, tokens, and file locations shared by Marskal's Rust shells (ADR 0018)"
license = "Apache-2.0"
publish = false

[dependencies]
jiff = "0.2.38"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }
