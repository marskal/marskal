# The Xcode project, for XcodeGen (ADR 0029). `xcodegen` writes
# Marskal.xcodeproj from this; the project is not committed or edited.
name: Marskal

options:
  bundleIdPrefix: app.marskal
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # Apple silicon only; no Intel simulator.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    # The team that signs a phone build, from the environment, so no one's
    # team is in the repository. Set it in devenv.local.nix (README).
    DEVELOPMENT_TEAM: ${MARSKAL_DEVELOPMENT_TEAM}

packages:
  MarskalKit:
    path: MarskalKit

targets:
  Marskal:
    type: application
    platform: iOS
    sources:
      - Marskal
    dependencies:
      - package: MarskalKit
        product: MarskalKit
      - target: MarskalWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marskal.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Marskal
    info:
      path: Marskal/Info.plist
      properties:
        # From MARKETING_VERSION and CURRENT_PROJECT_VERSION above; XcodeGen
        # would write 1.0 and 1.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The languages the app is translated into (ADR 0028, 0029).
        CFBundleLocalizations: [en, da]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.marskal.ios.sync
        NSAppTransportSecurity:
          # Plain http only to this machine, for the dev server at
          # marskal.localhost.
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    entitlements:
      path: Marskal/Marskal.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.marskal

  MarskalWidget:
    type: app-extension
    platform: iOS
    sources:
      - MarskalWidget
    dependencies:
      - package: MarskalKit
        product: MarskalKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marskal.ios.widget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Marskal
    info:
      path: MarskalWidget/Info.plist
      properties:
        # An extension's versions match its app's.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, da]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MarskalWidget/MarskalWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.marskal

schemes:
  Marskal:
    build:
      targets:
        Marskal: all
    run:
      config: Debug
    test:
      config: Debug
