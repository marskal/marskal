# The same nixpkgs channel as web/ (ADR 0004). rust-overlay gives a Rust
# with the iOS standard libraries, which nixpkgs' Rust lacks.
inputs:
  nixpkgs:
    url: https://flakehub.com/f/DeterminateSystems/nixpkgs-weekly/0.1
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
