[package]
name = "marskal"
version = "0.2.0"
edition = "2024"
description = "Marskal tasks from the terminal, for people and agents (ADR 0020)"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.38"
marskal-shell-common = { path = "../shell-common" }
marskal-replica = { path = "../../core/replica" }
marskal-rules = { path = "../../core/rules" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = { version = "3.5.0", features = ["json"] }
uuid = "1.29.0"
