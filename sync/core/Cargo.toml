[package]
name = "marskal-sync"
version = "0.1.0"
edition = "2024"
description = "The Marskal client sync engine: local SQLite, outbox, and pull merge (ADR 0018)"
publish = false

[dependencies]
jiff = { version = "0.2.38", features = ["serde"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v5", "v7", "serde"] }

[dev-dependencies]
