[package]
name = "marskal-sync-ffi"
version = "0.1.0"
edition = "2024"
description = "UniFFI bindings over the Marskal client sync engine, for the iOS app (ADR 0029)"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "marskal_sync_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dev-dependencies]
uuid = { version = "1.26.1", features = ["v7"] }

[dependencies]
jiff = "0.2.37"
marskal-sync = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uniffi = { version = "0.32.2", features = ["cli"] }
uuid = "1.26.1"
