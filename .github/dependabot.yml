# Dependency updates for every component. Minor and patch bumps come as one
# PR per ecosystem each week. A major is its own PR, and the same Cargo
# major across directories is one PR. A dependency bump changes nothing a
# user reads, so each PR is labelled `no changelog` (ADR 0038).
#
# A web/mix.lock bump also needs a new `depsHash` in web/nix/package.nix;
# the Nix deps hash workflow commits it to the PR.
version: 2

updates:
  - package-ecosystem: mix
    directory: /web
    schedule:
      interval: weekly
    labels: [no changelog]
    groups:
      mix:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /web/assets
      - /clients/webext-common
      - /clients/browser
      - /clients/thunderbird
    schedule:
      interval: weekly
    labels: [no changelog]
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /core/replica
      - /core/rules
      - /core/ffi
      - /clients/shell-common
      - /clients/terminal
    schedule:
      interval: weekly
    labels: [no changelog]
    groups:
      cargo:
        update-types: [minor, patch]
      # One PR per crate, covering every directory. Jiff is a direct
      # dependency of all five, and 0.2 and 1.0 do not unify.
      cargo-major:
        update-types: [major]
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [no changelog]
    groups:
      github-actions:
        patterns: ["*"]
