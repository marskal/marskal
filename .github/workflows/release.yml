# Tags and publishes a release when its PR is merged (ADR 0038): a push to
# master that adds .changes/<version>.md. Run it by hand with a version to
# release one whose notes are already on master, such as 0.1.0.
#
# A release whose notes have a section for an extension also gets that
# extension's packages and source archive attached, built from the tag, so
# they can be uploaded to the stores as they are.
name: Release

on:
  push:
    branches: [master]
    paths: [".changes/*.md"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version whose .changes/<version>.md is on master, such as 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      extensions: ${{ steps.extensions.outputs.list }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$INPUT" ]]; then
            version=$INPUT
          else
            version=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- '.changes/*.md' \
              | grep -E '^\.changes/[0-9]+\.[0-9]+\.[0-9]+\.md$' \
              | sed -E 's|^\.changes/(.*)\.md$|\1|' | sort -V | tail -n 1)
          fi
          if [[ -z "$version" ]]; then
            echo "No new version in this push."
            exit 0
          fi
          if [[ ! -f ".changes/$version.md" ]]; then
            echo "::error::.changes/$version.md is not on master."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged."
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag and publish
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tail -n +2 ".changes/$VERSION.md" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "Marskal $VERSION" --notes-file notes.md

      - name: Find the extensions in the notes
        id: extensions
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          list=()
          grep -qx '### Browser extension' ".changes/$VERSION.md" && list+=('"browser"')
          grep -qx '### Thunderbird extension' ".changes/$VERSION.md" && list+=('"thunderbird"')
          echo "list=[$(IFS=,; echo "${list[*]}")]" >> "$GITHUB_OUTPUT"

  extensions:
    name: Attach the ${{ matrix.extension }} extension
    needs: release
    if: needs.release.outputs.extensions != '' && needs.release.outputs.extensions != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extension: ${{ fromJSON(needs.release.outputs.extensions) }}
    defaults:
      run:
        working-directory: clients/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      # Each extension's devenv: the Node.js and zip its README names.
      - uses: cachix/install-nix-action@v32
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Check the manifest's version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          manifest=$(devenv shell -- node -p 'require("./static/manifest.json").version' | tail -n 1)
          if [[ "$manifest" != "$VERSION" ]]; then
            echo "::error::static/manifest.json is $manifest, not $VERSION."
            exit 1
          fi

      - name: Build
        run: devenv shell -- bash -euo pipefail -c 'npm ci && npm run package && npm run source'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          shopt -s nullglob
          files=()
          for f in marskal-*.zip marskal-*.xpi; do
            versioned="${f%.*}-$VERSION.${f##*.}"
            mv "$f" "$versioned"
            files+=("$versioned")
          done
          gh release upload "v$VERSION" "${files[@]}" --clobber
